<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App behind Nginx</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #efe4d2;
      --copper: #e0783c;
      --status: #8fb56a;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #161310;
      color: var(--paper);
      font-family: "Segoe UI", sans-serif;
    }
    main {
      max-width: 36rem;
      padding: 2rem;
    }
    p {
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--copper);
    }
    h1 {
      margin: 0.4rem 0 0;
      font-weight: 500;
      font-size: 2.4rem;
    }
    .ok {
      color: var(--status);
    }
  </style>
</head>
<body>
  <main>
    <p class="ok">Online · proxied</p>
    <h1>This page is served behind Nginx.</h1>
  </main>
</body>
</html>
